name: KADI hotfix security check
on:
  push:
    branches: [hotfix/reject-compressed-json]
    paths:
      - backend/**
      - .github/workflows/hotfix-security-check.yml
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/hotfix-security-check.yml
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Legacy main lockfile is out of sync (helmet is absent); install in CI only.
      - run: npm install --no-save
        working-directory: backend
      - run: npm test -- tests/security.test.js
        working-directory: backend
