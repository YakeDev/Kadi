name: KADI hotfix security check
on:
  push:
    branches: [hotfix/reject-compressed-json]
    paths:
      - backend/**
      - .github/workflows/hotfix-security-check.yml
  pull_request:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/hotfix-security-check.yml
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # Legacy main lockfile is out of sync (helmet is absent); install in CI only.
      - run: npm install --no-save
        working-directory: backend
      - run: npm run test:unit -- tests/security.test.js
        working-directory: backend
