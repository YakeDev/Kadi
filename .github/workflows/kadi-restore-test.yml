name: KADI - Isolated Restore Verification

# Read-only verification of the already-created encrypted artifact.
# Never touches KADI's production database.
on:
  workflow_dispatch:
  push:
    branches: [ops/secure-supabase-backup]
    paths:
      - .github/kadi-restore-run-request.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: kadi-isolated-restore
  cancel-in-progress: false

jobs:
  restore-check:
    if: >-
      github.repository == 'YakeDev/Kadi' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/ops/secure-supabase-backup' &&
      github.event.head_commit.message == 'ops(restore): trigger isolated drill'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      KADI_BACKUP_PASSPHRASE: ${{ secrets.KADI_BACKUP_PASSPHRASE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download and decrypt original encrypted archive
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ ${#KADI_BACKUP_PASSPHRASE} -lt 32 ]]; then
            echo "::error::KADI_BACKUP_PASSPHRASE is missing/too short"
            exit 1
          fi
          dest="$RUNNER_TEMP/kadi-restore-test"
          mkdir -p "$dest/plain"
          echo "KADI_RESTORE_DIR=$dest" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/YakeDev/Kadi/actions/artifacts/12554630442/zip" \
            -o "$dest/original-artifact.zip"
          unzip -q -j "$dest/original-artifact.zip" 'kadi-backup.tar.gpg' -d "$dest"
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt "$dest/kadi-backup.tar.gpg" \
            3<<< "$KADI_BACKUP_PASSPHRASE" > "$dest/decrypted.tar"
          tar -C "$dest/plain" -xf "$dest/decrypted.tar"
          test -s "$dest/plain/database.pgdump"
          test -s "$dest/plain/storage-manifest.json"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$dest/plain:/backup:ro" postgres:17 \
            pg_restore --list /backup/database.pgdump > "$dest/archive-list.txt"
          echo "Original ciphertext decrypted; PostgreSQL archive index verified."

      - name: Check private Storage files against SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          import { createHash } from 'node:crypto'
          const root = process.env.KADI_RESTORE_DIR
          const m = JSON.parse(fs.readFileSync(path.join(root, 'plain/storage-manifest.json')))
          if (m.projectRef !== 'giksqprkorjbgikprksb' || m.bucket !== 'company-logos') throw Error('Mismatched project/bucket')
          if (!Number.isSafeInteger(m.objectCount) || m.objectCount !== m.files.length) throw Error('Invalid Storage object count')
          let bytes = 0
          for (const item of m.files) {
            const base = path.resolve(root, 'plain/storage')
            const filename = path.resolve(base, item.objectPath)
            if (!filename.startsWith(base + path.sep)) throw Error('Invalid Storage path')
            const buf = fs.readFileSync(filename)
            if (buf.length !== item.bytes || createHash('sha256').update(buf).digest('hex') !== item.sha256) throw Error('Storage checksum mismatch')
            bytes += buf.length
          }
          if (bytes !== m.totalBytes) throw Error('Storage byte count mismatch')
          console.log('Storage manifest and checksums verified: ' + m.objectCount + ' objects')
          NODE

      - name: Restore KADI public schema and data to isolated PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          # Container contains ONLY disposable test data. Do not pass production credentials.
          docker run --detach --name kadi-restore-sandbox \
            --env POSTGRES_PASSWORD=isolated-test-credentials \
            --env POSTGRES_DB=kadi_restore_sandbox \
            postgres:17
          for i in $(seq 1 40); do
            if docker exec kadi-restore-sandbox pg_isready -q -U postgres -d kadi_restore_sandbox; then break; fi
            sleep 1
          done
          docker exec kadi-restore-sandbox psql -X -v ON_ERROR_STOP=1 \
            -U postgres -d kadi_restore_sandbox -c \
            'DROP SCHEMA public CASCADE; CREATE SCHEMA public; CREATE SCHEMA auth; CREATE SCHEMA extensions; CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions; CREATE EXTENSION IF NOT EXISTS "uuid-ossp" WITH SCHEMA extensions;'
          # Load only the app's public tables: managed Supabase auth/storage schemas
          # require a fully provisioned Supabase instance for a complete restore.
          docker cp "$KADI_RESTORE_DIR/plain/database.pgdump" \
            kadi-restore-sandbox:/tmp/database.pgdump
          docker exec kadi-restore-sandbox pg_restore \
            --no-owner --no-acl --exit-on-error --section=pre-data \
            --schema=public -U postgres -d kadi_restore_sandbox \
            /tmp/database.pgdump
          docker exec kadi-restore-sandbox pg_restore \
            --no-owner --no-acl --exit-on-error --section=data \
            --schema=public -U postgres -d kadi_restore_sandbox \
            /tmp/database.pgdump

      - name: Assert restored KADI record counts
        shell: bash
        run: |
          set -euo pipefail
          sql="SELECT concat_ws(':',
            (SELECT count(*) FROM public.tenants),
            (SELECT count(*) FROM public.profiles),
            (SELECT count(*) FROM public.clients),
            (SELECT count(*) FROM public.invoices),
            (SELECT count(*) FROM public.catalog_items));"
          actual="$(docker exec kadi-restore-sandbox psql -X -A -t \
            -v ON_ERROR_STOP=1 -U postgres -d kadi_restore_sandbox -c "$sql")"
          if [[ "$actual" != "8:6:12:21:2" ]]; then
            echo "::error::Restored record counts do not match backup-time expectations."
            exit 1
          fi
          {
            echo "### KADI isolated restoration — app tables"
            echo ""
            echo "Verified original encrypted artifact 12554630442."
            echo ""
            echo "- Decryption and PostgreSQL archive index: PASS"
            echo "- Private Storage manifest and checksums: PASS"
            echo "- Fresh PostgreSQL 17 restoration of public schema/data: PASS"
            echo "- Five business table counts (8/6/12/21/2): PASS"
            echo ""
            echo "**Not yet validated:** Supabase-managed auth/storage restoration, login/session behavior, live site behavior, and imported file serving on a separate Supabase project."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Isolated KADI public data restoration verified."

      - name: Apply PR14 security migration to restored production snapshot
        shell: bash
        run: |
          set -euo pipefail
          # This PostgreSQL 17 container is isolated. Nothing connects to Supabase production.
          # Recreate only enough managed Auth structure for public-schema FK/policy checks.
          cat > "$KADI_RESTORE_DIR/auth-stubs.sql" <<'SQL'
          create role anon;
          create role authenticated;
          create role service_role bypassrls;
          create table auth.users (id uuid primary key, email text);
          insert into auth.users(id,email) select id,email from public.profiles;
          create function auth.uid() returns uuid language sql stable as
            'select nullif(current_setting(''request.jwt.claim.sub'', true), '''')::uuid';
          create function auth.role() returns text language sql stable as
            'select nullif(current_setting(''request.jwt.claim.role'', true), '''')::text';
          SQL
          docker exec -i kadi-restore-sandbox psql -X -v ON_ERROR_STOP=1 -q \
            -U postgres -d kadi_restore_sandbox < "$KADI_RESTORE_DIR/auth-stubs.sql"
          docker exec kadi-restore-sandbox pg_restore \
            --no-owner --no-acl --exit-on-error --section=post-data \
            --schema=public -U postgres -d kadi_restore_sandbox \
            /tmp/database.pgdump
          # Read-only baseline for matching legacy financial records after migration.
          docker exec kadi-restore-sandbox psql -X -v ON_ERROR_STOP=1 -q \
            -U postgres -d kadi_restore_sandbox -c \
            "create schema kadi_audit; create table kadi_audit.before as
              select id, status, issue_date, due_date, total_amount, subtotal_amount,
              tax_rate, tax_amount, items, currency, notes
              from public.invoices;"
          # Pin PR14 migration to reviewed commit (not main; prevents production writes).
          curl --fail --silent --show-error --location \
            'https://raw.githubusercontent.com/YakeDev/Kadi/d74d56130819e0a60c3a7a758b8536791cbb4f8a/supabase/migrations/20261022064416_production_hardening.sql' \
            -o "$KADI_RESTORE_DIR/production_hardening.sql"
          docker exec -i kadi-restore-sandbox psql -X -v ON_ERROR_STOP=1 -q \
            -U postgres -d kadi_restore_sandbox < "$KADI_RESTORE_DIR/production_hardening.sql"
          cat > "$KADI_RESTORE_DIR/assertions.sql" <<'SQL'
          do $
          declare changed integer;
          begin
            if (select count(*) from public.invoices) <> 21
              then raise exception 'Migration changed invoice count'; end if;
            if exists (
              select 1 from kadi_audit.before b full join public.invoices i on i.id=b.id
              where b.id is null or i.id is null
                or b.total_amount is distinct from i.total_amount
                or b.subtotal_amount is distinct from i.subtotal_amount
                or b.tax_rate is distinct from i.tax_rate
                or b.tax_amount is distinct from i.tax_amount
                or b.status is distinct from i.status
                or b.issue_date is distinct from i.issue_date
                or b.due_date is distinct from i.due_date
                or b.notes is distinct from i.notes
            ) then raise exception 'Legacy invoice amounts or metadata changed'; end if;
            select count(*) into changed from kadi_audit.before
              where currency = '
        if: always()
        shell: bash
        run: |
          docker rm --force kadi-restore-sandbox >/dev/null 2>&1 || true
          if [[ -n "${KADI_RESTORE_DIR:-}" ]]; then
            rm -rf -- "$KADI_RESTORE_DIR"
          fi
;
            if changed <> 7 or exists (
               select 1 from public.invoices where currency not in ('USD','CDF')
            ) then raise exception 'USD label normalization did not complete'; end if;
            if (select count(*) from public.invoices where status <> 'draft' and issuer_snapshot is null) <> 20
              then raise exception 'Legacy invoice snapshots were unexpectedly generated'; end if;
            if (select count(*) from pg_policies where schemaname='public'
              and tablename in ('tenants','profiles','clients','catalog_items','invoices')) <> 5
              then raise exception 'Expected five restrictive tenant policies'; end if;
            if (select count(*) from pg_trigger
              where tgname='guard_kadi_invoice' and not tgisinternal) <> 1
              then raise exception 'Invoice immutable trigger missing'; end if;
          end $;
          SQL
          docker exec -i kadi-restore-sandbox psql -X -v ON_ERROR_STOP=1 -q \
            -U postgres -d kadi_restore_sandbox < "$KADI_RESTORE_DIR/assertions.sql"
          {
            echo ""
            echo "### PR14 production compatibility check"
            echo "- Production public tables + 21 archived invoices: restored inside a disposable PostgreSQL container."
            echo "- Existing FK/indexes/policies: restored and replaced in the test."
            echo "- Exact PR14 SQL migration: applied successfully to historical records."
            echo "- Financial amounts, taxes and statuses: preserved."
            echo "- Seven legacy dollar labels: normalized to USD without conversion."
            echo "- Twenty historical invoice snapshots: remain missing and require reconciliation."
            echo "- RLS and immutable-invoice trigger: present."
            echo ""
            echo "**This is NOT an end-to-end Supabase Auth/Storage or PDF validation.**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove disposable database container and plaintext
        if: always()
        shell: bash
        run: |
          docker rm --force kadi-restore-sandbox >/dev/null 2>&1 || true
          if [[ -n "${KADI_RESTORE_DIR:-}" ]]; then
            rm -rf -- "$KADI_RESTORE_DIR"
          fi
