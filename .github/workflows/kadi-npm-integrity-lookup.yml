name: KADI npm integrity lookup
on:
  push:
    branches: [fix/production-readiness]
    paths:
      - .github/workflows/kadi-npm-integrity-lookup.yml
permissions:
  contents: read
jobs:
  inspect-npm:
    runs-on: ubuntu-24.04
    steps:
      - name: Look up published package digest and dependencies
        run: |
          npm view body-parser@1.20.9 dist.integrity
          npm view body-parser@1.20.9 dependencies --json
